<script>
'use strict';
/* =====================================================================
   Carnet de Dépenses Chantier — moteur de données
   Principe : journal d'opérations immuable (append-only). Rien n'est
   jamais effacé : une suppression est une opération « del », une
   modification crée une nouvelle version. La fusion entre appareils
   est l'union des journaux ; les éditions concurrentes = conflits.
   ===================================================================== */
const APPV = '1.3';
const FORMAT = 'chantier-depenses';
/* Compatibilité : FORMAT_V = version du format de fichier (inchangé depuis la v1.0 : journal d'événements).
   Toute version 1.x lit les fichiers de toutes les autres 1.x. Les champs ou types inconnus sont
   conservés tels quels (compatibilité ascendante) et ré-exportés sans perte. */

/* ---------------- IndexedDB (avec repli mémoire) ---------------- */
const KP = { events: 'eid', files: 'id', meta: 'k' };
const IDB = {
  db: null, mem: null,
  async open(pid) {
    this.close();
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('cd_' + pid, 1);
        r.onupgradeneeded = () => { const d = r.result; for (const s in KP) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: KP[s] }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) {
      this.mem = { events: new Map(), files: new Map(), meta: new Map() };
      setTimeout(() => toast('Stockage local indisponible : les données ne seront PAS conservées. Exportez avant de fermer.', { err: 1, ms: 9000 }), 300);
    }
  },
  close() { if (this.db) { this.db.close(); this.db = null; } this.mem = null; },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store); let out;
      const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(store) { if (this.mem) return Promise.resolve([...this.mem[store].values()]); return this._tx(store, 'readonly', s => s.getAll()); },
  get(store, k) { if (this.mem) return Promise.resolve(this.mem[store].get(k)); return this._tx(store, 'readonly', s => s.get(k)); },
  put(store, v) { if (this.mem) { this.mem[store].set(v[KP[store]], v); return Promise.resolve(); } return this._tx(store, 'readwrite', s => s.put(v)); },
  putMany(store, arr) { if (!arr.length) return Promise.resolve(); if (this.mem) { arr.forEach(v => this.mem[store].set(v[KP[store]], v)); return Promise.resolve(); } return this._tx(store, 'readwrite', s => { arr.forEach(v => s.put(v)); }); },
  async setMeta(k, v) { try { await this.put('meta', { k, v }); } catch (e) { } },
  async getMeta(k) { try { const r = await this.get('meta', k); return r ? r.v : undefined; } catch (e) { return undefined; } }
};

function evSort(a, b) { return a.ts - b.ts || (a.dev < b.dev ? -1 : a.dev > b.dev ? 1 : 0) || (a.eid < b.eid ? -1 : a.eid > b.eid ? 1 : 0); }
function rebuild() {
  const evs = S.events.slice().sort(evSort);
  const R = {}; COLLS.forEach(c => R[c] = {});
  const hist = {};
  for (const e of evs) {
    const m = R[e.coll] || (R[e.coll] = {});
    let r = m[e.rid];
    if (!r) r = m[e.rid] = { id: e.rid, coll: e.coll, d: {}, del: false, head: null, headTs: 0, created: e.ts, by: e.au };
    if (e.op === 'put') r.d = e.data || {};
    else if (e.op === 'del') r.del = true;
    else if (e.op === 'restore') r.del = false;
    r.head = e.eid; r.headTs = e.ts; r.upd = e.ts; r.updBy = e.au;
    (hist[e.rid] || (hist[e.rid] = [])).push(e);
  }
  const conf = [];
  for (const rid in hist) {
    const h = hist[rid]; const byBase = {}; const merged = new Set();
    h.forEach(e => { (e.merged || []).forEach(x => merged.add(x)); const b = e.base || '∅'; (byBase[b] || (byBase[b] = [])).push(e); });
    for (const b in byBase) { const g = byBase[b]; if (g.length > 1 && !g.every(e => merged.has(e.eid))) conf.push({ rid, coll: g[0].coll, base: b, evs: g }); }
  }
  S.sorted = evs; S.R = R; S.hist = hist; S.conf = conf;
  S.P = Object.assign({ name: 'Chantier', rates: { EUR: 655.957, USD: 600, GBP: 760 }, modes: DEF_MODES, units: DEF_UNITS }, R.project.project ? R.project.project.d : {});
}

const isAdmin = () => USER && USER.role === 'admin';
const canWrite = () => USER && USER.role !== 'lecture';
function canEdit(r) {
  if (!canWrite()) return false;
  if (!r) return true;
  if (r.d.locked && !isAdmin()) return false;
  if (r.coll === 'expenses' || r.coll === 'funds') { if (S.P.closedUntil && r.d.date && r.d.date <= S.P.closedUntil && !isAdmin()) return false; }
  if (['lots', 'cats', 'project'].includes(r.coll) && !isAdmin()) return false;
  return true;
}
function whyNot(r) {
  if (!canWrite()) return 'Profil « consultation seule ».';
  if (r && r.d.locked && !isAdmin()) return 'Écriture validée (verrouillée) — seul un administrateur peut la modifier.';
  if (r && r.d.date && S.P.closedUntil && r.d.date <= S.P.closedUntil && !isAdmin()) return 'Période clôturée jusqu’au ' + fdate(S.P.closedUntil) + '.';
  return 'Réservé à l’administrateur.';
}

/* ---------------- Écriture dans le journal ---------------- */
function mkEvent(coll, rid, op, data, extra, baseOverride) {
  const r = rec(coll, rid);
  let ts = Date.now(); if (r && ts <= r.headTs) ts = r.headTs + 1;
  const e = { eid: uid() + DEV.slice(-4), coll, rid, op, base: baseOverride !== undefined ? baseOverride : (r ? r.head : null), au: USER ? USER.name : '?', dev: DEV, ts };
  if (op === 'put') e.data = JSON.parse(JSON.stringify(data));
  if (extra) Object.assign(e, extra);
  return e;
}
async function commit(coll, rid, op, data, extra) {
  const e = mkEvent(coll, rid, op, data, extra);
  await IDB.put('events', e);
  S.events.push(e); rebuild(); afterChange();
  return e;
}
async function commitMany(list) { // list of [coll,rid,op,data] — enregistrements neufs
  let ts = Date.now();
  const evs = list.map(([c, rid, op, data, extra]) => { const e = mkEvent(c, rid, op, data, extra); e.ts = ts++; return e; });
  await IDB.putMany('events', evs); S.events.push(...evs); rebuild(); afterChange();
}

async function delRec(coll, rid, label) {
  const r = rec(coll, rid); if (!r) return;
  if (!canEdit(r)) return toast(whyNot(r), { err: 1 });

}

/* ---------------- Calculs ---------------- */
function rateOf(d) { if (!d.cur || d.cur === 'XAF') return 1; return num(d.rate) || (S.P.rates || {})[d.cur] || 1; }
function X(r) { // dépense dérivée
  const d = r.d, rt = rateOf(d), amt = num(d.amount) * rt, fee = num(d.fees) * rt;
  const paid = d.status === 'du' ? 0 : amt;
  const due = d.status === 'du' ? amt : d.status === 'acompte' ? num(d.reste) * rt : 0;
  return { r, d, id: r.id, amt, fee, paid, due, cost: paid + fee };
}
function FX(r) { const d = r.d, rt = rateOf(d), sent = num(d.amount) * rt, fee = num(d.fees) * rt; const recv = num(d.received) || sent; return { r, d, id: r.id, sent, fee, recv }; }
function budgetTotal() { return num(S.P.budget) || sum(live('lots'), l => num(l.d.budget)); }
function cashBook() {
  const B = {};
  const g = id => B[id] || (B[id] = { id, recv: 0, sent: 0, spent: 0, due: 0 });
  live('funds').map(FX).forEach(f => { if (f.d.to) g(f.d.to).recv += f.recv; if (f.d.from) g(f.d.from).sent += f.sent + f.fee; });
  live('expenses').map(X).forEach(x => { if (x.d.payer) { g(x.d.payer).spent += x.cost; } });
  Object.values(B).forEach(b => b.bal = b.recv - b.sent - b.spent);
  return Object.values(B).sort((a, b) => b.bal - a.bal);
}

/* ---------------- Justificatifs (photos / PDF) ---------------- */
function readAsDataURL(f) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(f); }); }
async function compressImage(file, max = 1400, q = .72) {
  const url = await readAsDataURL(file);
  return new Promise(res => {
    const im = new Image(); im.onload = () => {
      let { width: w, height: h } = im; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
      try { res(c.toDataURL('image/jpeg', q)); } catch (e) { res(url); }
    }; im.onerror = () => res(url); im.src = url;
  });
}
async function storeFile(file) {
  let data, type = file.type || 'application/octet-stream';
  if (type.startsWith('image/')) { data = await compressImage(file); type = 'image/jpeg'; }
  else { if (file.size > 4e6) { toast('Fichier trop volumineux (max 4 Mo) : ' + file.name, { err: 1 }); return null; } data = await readAsDataURL(file); }
  const id = 'f' + uid(); await IDB.put('files', { id, name: file.name, type, data, ts: Date.now(), by: USER.name });
  return id;
}
const fileCache = new Map();
async function getFile(id) { if (fileCache.has(id)) return fileCache.get(id); const f = await IDB.get('files', id); if (f) fileCache.set(id, f); return f; }
async function hydrateThumbs(root = document) {
  for (const el of $$('[data-fid]', root)) {
    if (el.dataset.h) continue; el.dataset.h = 1;
    const f = await getFile(el.dataset.fid);
    if (!f) { el.insertAdjacentHTML('afterbegin', '<span class="muted">absent</span>'); el.title = 'Justificatif non présent sur cet appareil (fusion faite sans justificatifs ?)'; continue; }
    if (f.type.startsWith('image/')) el.insertAdjacentHTML('afterbegin', `<img src="${f.data}" alt="">`); else el.insertAdjacentHTML('afterbegin', '<b>PDF</b>');
    el.title = f.name;
  }
}
async function viewFile(id) {
  const f = await getFile(id); if (!f) return toast('Justificatif absent de cet appareil', { err: 1 });
  const body = f.type.startsWith('image/') ? `<img src="${f.data}" style="max-width:100%;border-radius:8px">` : `<p>${esc(f.name)}</p>`;

}

const fname = () => 'chantier_' + (S.P.name || 'export').replace(/[^\p{L}\p{N}]+/gu, '_').slice(0, 40) + '_' + today() + '.json';
function download(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: type || 'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* Partage direct (Android : WhatsApp, Gmail, Drive…). Chrome n'autorise pas le partage de .json :
   le fichier est donc partagé en .txt (contenu identique, reconnu à l'import). */
async function shareBackup(withFiles) {
  const b = await buildBackup(withFiles); const txt = JSON.stringify(b);
  const name = fname().replace(/\.json$/, '.txt');
  let file = null; try { file = new File([txt], name, { type: 'text/plain' }); } catch (e) { }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Chantier ' + S.P.name, text: `Fichier chantier « ${S.P.name} » (${fdate(today())}, ${USER.name}). À ouvrir avec Carnet de Chantier : Partager → Chantier, ou « Fusionner un fichier reçu ».` });
      await markExported(); toast('Fichier partagé' + (withFiles ? '' : ' (sans justificatifs)'));
    } catch (e) { if (e.name !== 'AbortError') { toast('Partage impossible (' + e.message + ') : fichier téléchargé à la place.', { err: 1, ms: 6000 }); download(fname(), txt, 'application/json'); await markExported(); } }
  } else { download(fname(), txt, 'application/json'); await markExported(); toast('Partage direct indisponible ici : le fichier a été téléchargé.', { ms: 5000 }); }
}
/* Fichier reçu via la cible de partage Android (voir sw.js) */
async function consumeSharedFile() {
  if (!/[?&]shared=1/.test(location.search)) return;
  history.replaceState(null, '', location.pathname);
  try {
    const c = await caches.open('cdc-share'); const r = await c.match('./shared-file');
    if (!r) return toast('Aucun fichier reçu.', { err: 1 });
    await c.delete('./shared-file');
    const txt = await r.text(); let j;
    try { j = JSON.parse(txt); } catch (e) { return toast('Le fichier partagé n’est pas un fichier chantier.', { err: 1, ms: 6000 }); }
    await importData(j);

async function importData(j, o = {}) {
  if (j && j.format === FORMAT + '-bundle' && Array.isArray(j.projects)) {
    const names = j.projects.map(p => '« ' + esc(p.projectName || '?') + ' »').join(', ');
    if (!await ask(`Ce fichier contient <b>${j.projects.length} chantier(s)</b> : ${names}.<br>Les importer / fusionner sur cet appareil ? Rien n’est écrasé.`, { ok: 'Importer' })) return;
    const cur = S && S.pid; let n = 0;
    for (const p of j.projects) { try { await importData(p, { bundle: 1, quiet: 1 }); n++; } catch (e) { toast('Chantier ignoré : ' + e.message, { err: 1 }); } }
    if (cur && projects().find(p => p.pid === cur)) await openProject(cur);
    toast(`${n} chantier(s) importé(s) / fusionné(s)`, { ms: 6000 }); return;
  }
  if (!j || j.format !== FORMAT || !Array.isArray(j.events)) throw new Error('Ce fichier n’est pas un fichier « Carnet de Chantier ».');
  if ((j.version || 1) > FORMAT_V) toast('Fichier créé par une version plus récente de l’application : les données sont importées et conservées ; mettez l’application à jour pour tout afficher.', { ms: 9000 });
  if (!S || j.pid !== S.pid) {
    const known = projects().find(p => p.pid === j.pid);
    if (S && !o.bundle && !await ask(`Ce fichier concerne le chantier « <b>${esc(j.projectName)}</b> », différent du chantier ouvert (« ${esc(S.P.name)} »).<br>${known ? 'Il sera ouvert et le fichier y sera fusionné.' : 'Il sera ajouté comme nouveau chantier sur cet appareil.'}`, { ok: 'Continuer' })) return;
    regProject(j.pid, j.projectName); await openProject(j.pid);
  }
  const have = new Set(S.events.map(e => e.eid));
  const nw = j.events.filter(e => validEvent(e) && !have.has(e.eid));
  const bad = j.events.filter(e => !validEvent(e)).length;
  const confBefore = S.conf.length;
  await IDB.putMany('events', nw);
  let nf = 0;
  if (Array.isArray(j.files) && j.files.length) {
    const haveF = new Set((await IDB.all('files')).map(f => f.id));
    const nfs = j.files.filter(f => f && f.id && f.data && !haveF.has(f.id)); nf = nfs.length; await IDB.putMany('files', nfs);

  S.events.push(...nw); rebuild(); afterChange(); render();
  const nc = S.conf.length - confBefore;
  let msg = `Fusion terminée : ${nw.length} opération(s) nouvelle(s)` + (nf ? `, ${nf} justificatif(s)` : '') + (nw.length ? '' : ' — déjà à jour') + '.';
  if (bad) msg += ` ${bad} ligne(s) invalide(s) ignorée(s).`;
  if (!o.quiet) toast(msg, { ms: 6000 });
  if (nc > 0) toast(`${nc} conflit(s) détecté(s) : voir Journal › Conflits`, { err: 1, ms: 8000 });
}

  const get = s => new Promise((res, rej) => { const q = db.transaction(s).objectStore(s).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  const events = (await get('events')).sort(evSort), files = await get('files'); db.close();

/* =====================================================================

function fmtVal(k, v, coll) {
  if (v == null || v === '') return '∅';
  if (k === 'lot') return lotName(v); if (k === 'cat') return catName(v);
  if (['payer', 'payee', 'from', 'to'].includes(k)) return pName(v);
  if (k === 'files') return (v || []).length + ' fichier(s)';
  if (k === 'locked') return v ? 'oui' : 'non';
  if (k === 'status') return STATUS[v] || v;
  if (k === 'date' || k === 'closedUntil' || k === 'start' || k === 'end') return fdate(v);
  if (typeof v === 'object') return Array.isArray(v) ? v.join(', ') : Object.entries(v).map(([a, b]) => a + ' ' + b).join(', ');
  return String(v);
}
function diffHTML(a, b, coll) {
  a = a || {}; const keys = [...new Set([...Object.keys(a), ...Object.keys(b || {})])];
  const ch = keys.filter(k => JSON.stringify(a[k] ?? '') !== JSON.stringify((b || {})[k] ?? ''));
  if (!ch.length) return '<div class="diff muted">aucun changement de contenu</div>';
  return '<div class="diff">' + ch.map(k => `<div><b>${esc(FIELD_L[k] || k)}</b> : ${a[k] != null && a[k] !== '' ? `<span class="o">${esc(fmtVal(k, a[k], coll))}</span> → ` : ''}<span class="n">${esc(fmtVal(k, (b || {})[k], coll))}</span></div>`).join('') + '</div>';
}
function recTitle(coll, r) {

/* =====================================================================
   Graphiques (SVG natif, hors-ligne) + vue Analyses
   Palette catégorielle validée (ordre fixe, jamais recyclée) : 7 couleurs + « Autres » gris.

const SERIES_N = 7;
const sc = i => i < 0 ? 'var(--sO)' : `var(--s${i + 1})`;
const fmtS = v => { v = Math.round(v || 0); const a = Math.abs(v); return a >= 1e6 ? nf2.format(Math.round(v / 1e4) / 100) + ' M' : a >= 1e3 ? Math.round(v / 1e3) + ' k' : String(v); };
function niceTicks(max, n = 4) {
  if (!(max > 0)) return [0, 1];
  const raw = max / n, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const t = []; for (let v = 0; v <= max + step * .001; v += step) t.push(v); if (t[t.length - 1] < max) t.push(t[t.length - 1] + step); return t;
}

/* =====================================================================

const RTYPES = { etat: 'État du projet (synthèse complète)', lot: 'Par phase / segment', payee: 'Par bénéficiaire (à qui)', payer: 'Par payeur & caisses (qui a payé)', period: 'Par période', cat: 'Par catégorie', mode: 'Par moyen de paiement', debts: 'Dettes & restes à payer', mat: 'Matériaux & quantités', audit: 'Journal des modifications' };

function rpData() {

}
const repPeriod = () => `${RP.from ? fdate(RP.from) : 'début du chantier'} → ${RP.to ? fdate(RP.to) : 'aujourd’hui (' + fdate(today()) + ')'}`;
function kpiRow(xs, extra) {
  const paid = sum(xs, 'paid'), fee = sum(xs, 'fee'), due = sum(xs, 'due'), cost = paid + fee, B = budgetTotal();
  return `<div class="kpis"><div class="kpi"><div class="l">Coût réalisé</div><div class="v">${mshort(cost)}</div><div class="s">FCFA · ${xs.length} opération(s)</div></div><div class="kpi"><div class="l">dont frais</div><div class="v">${mshort(fee)}</div></div><div class="kpi"><div class="l">Reste à payer</div><div class="v">${mshort(due)}</div></div>${extra || ''}</div>`;

/* tableau récapitulatif par dimension */
function dimTable(xs, dim, o = {}) {
  const rows = totalsBy(xs, dim, 'cost'); const tot = sum(rows, 'v'); const tdue = sum(rows, 'due');
  if (dim === 'lot' && o.budget) lotsSorted().forEach(l => { if (!rows.find(r => r.id === l.id) && num(l.d.budget)) rows.push({ id: l.id, name: l.d.name, v: 0, n: 0, due: 0, slot: -1 }); });
  if (dim === 'lot') rows.sort((a, b) => num((rec('lots', a.id) || { d: { order: 1e9 } }).d.order) - num((rec('lots', b.id) || { d: { order: 1e9 } }).d.order));
  const last = {}; xs.forEach(x => { const k = dimId(x, dim); if (!last[k] || x.d.date > last[k]) last[k] = x.d.date; });

function matTable(xs) {

/* =====================================================================
   Verrouillage par code PIN (par appareil)
   - PIN jamais stocké en clair : empreinte PBKDF2-SHA256 (150 000 itérations) + sel
   - Code de secours (affiché une seule fois) pour réinitialiser un PIN oublié sans perte de données
   - Verrouillage auto : à l'ouverture, après inactivité ou retour d'arrière-plan
   ===================================================================== */
const lockCfg = () => LS.get('cd_lock', null); // {salt,hash,len,rsalt,rhash,timeout}
const lockAvailable = () => !!(window.crypto && crypto.subtle && window.TextEncoder);
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const randStr = (n, abc) => { const a = crypto.getRandomValues(new Uint8Array(n)); return [...a].map(x => abc[x % abc.length]).join(''); };
async function pinHash(pin, salt) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 150000, hash: 'SHA-256' }, key, 256));
}
async function checkPin(pin) { const c = lockCfg(); return !!c && (await pinHash(pin, c.salt)) === c.hash; }
const normRecovery = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function weakPin(p) { return /^(\d)\1+$/.test(p) || '0123456789012'.includes(p) || '9876543210987'.includes(p); }

let LOCKED = false, lastAct = Date.now(), hiddenAt = 0;
function showLock() {
  if (LOCKED) return Promise.resolve();
  const c = lockCfg(); if (!c) return Promise.resolve();
  LOCKED = true;
  return new Promise(res => {
    const el = document.createElement('div'); el.id = 'lockScr';
    el.innerHTML = `<div class="lk"><div class="brand" style="justify-content:center"><span class="logo">⚒</span><span>Carnet de Chantier</span></div>
      <p class="lkmsg" id="lkMsg">Saisissez votre code PIN</p>
      <div class="dots" id="lkDots"></div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="del" aria-label="Effacer">⌫</button><button data-k="0">0</button><button data-k="ok" aria-label="Valider">✓</button></div>
      <button class="lkforgot" id="lkForgot">Code oublié ?</button></div>`;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    document.body.appendChild(el); document.body.classList.add('locked');
    let pin = ''; let busy = false;
    const dots = () => { $('#lkDots', el).innerHTML = Array.from({ length: Math.max(c.len || 4, pin.length) }, (_, i) => `<span class="${i < pin.length ? 'on' : ''}"></span>`).join(''); };
    const msg = (t, err) => { const m = $('#lkMsg', el); m.textContent = t; m.classList.toggle('err', !!err); };
    const waitLeft = () => { const f = LS.get('cd_lock_fail', { n: 0, until: 0 }); return Math.max(0, f.until - Date.now()); };
    const unlock = () => { LOCKED = false; lastAct = Date.now(); el.remove(); document.body.classList.remove('locked'); document.removeEventListener('keydown', onKey, true); LS.set('cd_lock_fail', { n: 0, until: 0 }); res(); };
    const submit = async () => {
      if (busy || !pin) return;
      const w = waitLeft(); if (w) { msg(`Trop d’essais. Réessayez dans ${Math.ceil(w / 1000)} s.`, 1); pin = ''; dots(); return; }
      busy = true; msg('Vérification…');
      const ok = await checkPin(pin); busy = false;
      if (ok) return unlock();
      const f = LS.get('cd_lock_fail', { n: 0, until: 0 }); f.n++;
      if (f.n >= 5) f.until = Date.now() + Math.min(900, 30 * 2 ** (f.n - 5)) * 1000;
      LS.set('cd_lock_fail', f); pin = ''; dots();
      el.querySelector('.lk').classList.remove('shake'); void el.offsetWidth; el.querySelector('.lk').classList.add('shake');
      msg(f.n >= 5 ? `Code incorrect. Patientez ${Math.ceil(waitLeft() / 1000)} s.` : `Code incorrect (${f.n}/5)`, 1);
    };
    const key = k => {
      if (busy) return;
      if (k === 'del') pin = pin.slice(0, -1);
      else if (k === 'ok') return submit();
      else if (/^\d$/.test(k) && pin.length < 8) { pin += k; if (pin.length === (c.len || 0)) { dots(); return submit(); } }
      dots();
    };
    const onKey = e => { if (!LOCKED || (e.target.closest && e.target.closest('.overlock'))) return; if (/^\d$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('del'); else if (e.key === 'Enter') key('ok'); else return; e.preventDefault(); e.stopPropagation(); };
    document.addEventListener('keydown', onKey, true);
    el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) key(b.dataset.k); });
    $('#lkForgot', el).onclick = async () => {
      const code = await ask('Saisissez le <b>code de secours</b> noté lors de la création du PIN.<br><span class="small muted">Vos données ne sont pas touchées.</span>', { title: 'Code oublié', input: 'Code de secours', ok: 'Valider', cls: 'overlock' });
      if (!code) return;
      const cc = lockCfg();
      if (!cc.rhash || (await pinHash(normRecovery(code), cc.rsalt)) !== cc.rhash) return msg('Code de secours incorrect.', 1);
      unlock(); toast('Code de secours accepté : définissez un nouveau PIN.'); setTimeout(() => pinDialog(false, true), 200);
    };
    dots();
    const w = waitLeft(); if (w) msg(`Trop d’essais. Réessayez dans ${Math.ceil(w / 1000)} s.`, 1);
  });
}

async function resolveConflict(ci, vi) {

  const merged = c.evs.map(x => x.eid);
  if (e.op === 'del') await commit(c.coll, c.rid, 'del', null, { merged });

  render(); toast('Conflit résolu');
}

function registerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const prompt = w => toast('Nouvelle version de l’application disponible', { action: 'Mettre à jour', ms: 20000, fn: () => w.postMessage('skipWaiting') });
    if (reg.waiting && navigator.serviceWorker.controller) prompt(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) prompt(w); }); });
    setInterval(() => reg.update().catch(() => { }), 3600e3);
  }).catch(() => { });
  let reloaded = false; const hadCtrl = !!navigator.serviceWorker.controller; // 1re installation : pas de rechargement
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloaded) { reloaded = true; location.reload(); } });

/* =====================================================================
   Délégation d'événements & démarrage
   ===================================================================== */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-tab],[data-exp],[data-fund],[data-hist],[data-edit],[data-del],[data-restore],[data-resolve],[data-go],[data-go2],[data-filt],[data-label],[data-openp]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) return go(ds.tab);
  if (ds.exp) return expenseDetail(ds.exp);
  if (ds.fund) return fundDetail(ds.fund);
  if (ds.hist) { const [c, id] = ds.hist.split(':'); return historyModal(c, id); }
  if (ds.edit) { const [c, id] = ds.edit.split(':'); return refForm(c, id); }
  if (ds.del) { const [c, id] = ds.del.split(':'); return delRec(c, id); }
  if (ds.restore) { const [c, id] = ds.restore.split(':'); return restoreRec(c, id); }
  if (ds.resolve) { const [a, b] = ds.resolve.split(':').map(Number); return resolveConflict(a, b); }
  if (ds.go) { const [k, v] = ds.go.split(':'); resetFilters(); F[k] = v; F.g1 = 'month'; F.g2 = 'none'; return go('exp'); }
  if (ds.go2) return go(ds.go2);
  if (ds.filt) { resetFilters(); F.nojust = true; return go('exp'); }
  if (ds.label) { resetFilters(); F.label = ds.label; F.g1 = 'none'; F.g2 = 'none'; return go('exp'); }
  if (ds.openp) { closeAllModals(); return openProject(ds.openp); }
  switch (ds.act) {
    case 'newExp': return expenseForm();
    case 'newFund': return fundForm();
    case 'newLot': return refForm('lots');
    case 'newCat': return refForm('cats');
    case 'newPerson': return refForm('people');
    case 'csv': return csvExport(filtered());
    case 'repHtml': return exportReportHTML();
    case 'repCsv': return exportReportCSV();
    case 'anaPrint': return window.print();
    case 'etatPdf': Object.assign(RP, { type: 'etat', sel: '', from: '', to: '', charts: true }); go('report'); setTimeout(() => window.print(), 400); return;
    case 'exportAll': return exportAll();
    case 'clearF': { const g = [F.g1, F.g2]; resetFilters();[F.g1, F.g2] = g; return render(); }
    case 'print': return window.print();
    case 'export': return exportBackup(true);
    case 'exportLight': return exportBackup(false);
    case 'pinSet': return pinDialog(false);
    case 'pinChange': return pinDialog(true);
    case 'pinRemove': return removePin();
    case 'lockNow': closeAllModals(); return showLock();
    case 'share': return shareBackup(true);
    case 'shareLight': return shareBackup(false);
    case 'install': if (deferredInstall) { deferredInstall.prompt(); const r = await deferredInstall.userChoice; deferredInstall = null; if (r.outcome === 'accepted') toast('Application installée'); render(); } return;
    case 'openFile': return $('#importInput').click();
    case 'link': return linkFile();
    case 'reactivate': return reactivateFile();
    case 'unlink': return unlinkFile();
    case 'saveProj': return saveProject();
    case 'changeUser': await askUser(true); return render();
    case 'theme': { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); LS.set('cd_theme', cur === 'dark' ? 'light' : 'dark'); return applyTheme(); }
    case 'newProj': return newProjectDialog();
    case 'demo': return loadDemo();
    case 'jlMore': JL.n += 300; return render();
  }
});
$('#projSel').addEventListener('change', e => {
  const v = e.target.value;
  if (v === '__new') { e.target.value = S.pid; return newProjectDialog(); }
  if (v === '__open') { e.target.value = S.pid; return $('#importInput').click(); }
  openProject(v);
});
$('#importInput').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await importFile(f); });
$('#bkStatus').addEventListener('click', () => { if (S && S.fh && !S.fhOk) reactivateFile(); else go('settings'); });
$('#lockBtn').addEventListener('click', () => showLock());
document.addEventListener('change', e => { if (e.target.id === 'lockTo') setLockTimeout(e.target.value); });
$('#userBadge').addEventListener('click', async () => { await askUser(true); render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modals').lastElementChild) closeModal(); });
window.addEventListener('beforeunload', e => { if (S && !S.fhOk && unsaved() > 0 && IDB.mem) { e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  applyTheme();
  if (lockCfg()) await showLock();
  if (!USER) await askUser();
  const ps = projects(), cur = LS.get('cd_current', null);
  if (cur && ps.find(p => p.pid === cur)) await openProject(cur);
  else if (ps.length) await openProject(ps[0].pid);
  else render();
  registerSW();
  await consumeSharedFile();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
})();
</script>
